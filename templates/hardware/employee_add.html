{% extends "base.html" %}
{% block title %}— Add Employee{% endblock %}
{% block nav_add_emp %}active{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <div class="page-title">ADD EMPLOYEE</div>
    <div style="font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:2px;">// REGISTER NEW EMPLOYEE INTO SYSTEM</div>
  </div>
  <span class="page-badge">NEW RECORD</span>
</div>

<div class="card corner-dec" style="max-width:700px;padding:32px;">
  <form id="emp-form">
    {% csrf_token %}
    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">Employee ID *</label>
        <input type="text" name="emp_id" class="form-control" placeholder="e.g. EMP-2024-001" required>
      </div>
      <div class="form-group">
        <label class="form-label">Full Name *</label>
        <input type="text" name="name" class="form-control" placeholder="Full name" required>
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">Department *</label>
        <input type="text" name="department" class="form-control" placeholder="e.g. IT, Editorial, Admin" required>
      </div>
      <div class="form-group">
        <label class="form-label">Designation *</label>
        <input type="text" name="designation" class="form-control" placeholder="e.g. Reporter, Developer" required>
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">Email *</label>
        <input type="email" name="email" class="form-control" placeholder="employee@dainikbhaskar.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Phone *</label>
        <input type="text" name="phone" class="form-control" placeholder="+91 XXXXX XXXXX" required>
      </div>
    </div>
    <div style="display:flex;gap:12px;margin-top:8px;">
      <button type="submit" class="btn btn-primary" id="submit-btn">
        <span id="btn-text">+ REGISTER EMPLOYEE</span>
        <span id="btn-loader" class="loader" style="display:none;"></span>
      </button>
      <a href="/employees/" class="btn btn-ghost">CANCEL</a>
    </div>
  </form>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.getElementById('emp-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  document.getElementById('btn-text').style.display = 'none';
  document.getElementById('btn-loader').style.display = 'inline-block';
  btn.disabled = true;

  const fd = new FormData(this);
  const res = await fetch('/employees/add/', { method: 'POST', body: fd });
  const data = await res.json();

  if (data.success) {
    showToast('// EMPLOYEE REGISTERED SUCCESSFULLY');
    setTimeout(() => window.location.href = '/employees/', 1200);
  } else {
    showToast('ERROR: ' + data.error, 'error');
    document.getElementById('btn-text').style.display = 'inline';
    document.getElementById('btn-loader').style.display = 'none';
    btn.disabled = false;
  }
});
</script>
{% endblock %}
