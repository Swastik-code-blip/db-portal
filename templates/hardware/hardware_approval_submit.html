{% extends "base.html" %}
{% block title %}— HW Request{% endblock %}
{% block content %}
<div style="max-width:500px;margin:0 auto;">
  <div class="page-header"><div class="page-title">HARDWARE REQUEST</div></div>
  <div class="card" style="padding:24px;">
    <form id="hwreq-form">{% csrf_token %}
      <div class="form-group"><label class="form-label">Employee ID *</label><input type="text" name="emp_id" class="form-control" required></div>
      <div class="form-group"><label class="form-label">Your Name *</label><input type="text" name="employee_name" class="form-control" required></div>
      <div class="form-group"><label class="form-label">Hardware ID (if existing)</label><input type="text" name="hw_id" class="form-control"></div>
      <div class="form-group"><label class="form-label">Request Type</label>
        <select name="request_type" class="form-control"><option value="repair">Repair</option><option value="replace">Replace</option><option value="new">New Hardware</option></select>
      </div>
      <div class="form-group"><label class="form-label">Issue *</label><textarea name="issue_description" class="form-control" rows="4" required></textarea></div>
      <button type="submit" class="btn btn-amber">SUBMIT REQUEST</button>
    </form>
    <div id="msg" style="display:none;margin-top:14px;padding:12px;border-radius:5px;font-family:'Share Tech Mono',monospace;font-size:11px;"></div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
document.getElementById('hwreq-form').addEventListener('submit',async function(e){
  e.preventDefault();const fd=new FormData(this);
  const res=await fetch('/hw-approval/',{method:'POST',body:fd});const d=await res.json();
  const m=document.getElementById('msg');m.style.display='block';
  m.style.color=d.success?'var(--green)':'var(--red)';
  m.textContent=d.success?'✓ '+d.message:'✗ '+d.error;
  if(d.success)this.reset();
});
</script>
{% endblock %}
