[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = [
  "python manage.py collectstatic --noinput",
  "python manage.py migrate --run-syncdb",
  "python railway_setup.py"
]

[start]
cmd = "gunicorn db_portal.wsgi --bind 0.0.0.0:$PORT"
